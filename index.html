<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>토평고등학교 전공과 준비반 복장점검</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#eef3f5;
  --line:#8b6a4a;
  --cream:#fff8e8;
  --mint:#eaf8f3;
  --green:#5ca15b;
  --yellow:#f3b223;
  --blue:#5b91c9;
  --red:#dc5754;
  --ink:#22180f;
}

body{
  margin:0;
  font-family:"Malgun Gothic","Noto Sans KR",sans-serif;
  background:#dce6ea;
  color:var(--ink);
}

button{
  font:inherit;
}

#app{
  width:min(1500px,100%);
  min-height:100vh;
  margin:auto;
  padding:14px;
  background:var(--bg);
  border:3px solid #99a8ae;
}

/* 상단 */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.badge{
  padding:8px 16px;
  border:2px solid #aaa;
  border-radius:999px;
  background:white;
  font-weight:800;
}

/* 진행 단계 */
.steps{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px;
  margin-bottom:10px;
}

.step{
  background:#fff7e5;
  border:2px solid #c7a77f;
  border-radius:8px;
  padding:7px 4px 9px;
  text-align:center;
  min-height:64px;
  font-weight:700;
  font-size:12px;
}

.step .num{
  width:25px;
  height:25px;
  margin:0 auto 4px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#766758;
  color:white;
  font-weight:900;
}

.step.done{
  background:#edf7e8;
  border-color:#71a969;
}

.step.done .num{
  background:#4e9b51;
}

.step.active{
  background:#fff1bd;
  border-color:#f0a000;
  color:#cf3b28;
}

.step.active .num{
  background:#ed9d00;
}

/* 메인 */
.main{
  display:grid;
  grid-template-columns:52% 48%;
  gap:12px;
}

.left,
.right{
  min-width:0;
}

/* 왼쪽 그림 */
.scene{
  background:#fffdf6;
  border:3px solid var(--line);
  border-radius:8px;
  min-height:480px;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}

.scene svg{
  width:100%;
  max-width:720px;
  height:auto;
}

.caption{
  margin-top:7px;
  padding:11px 14px;
  border:2px solid #c6d2d7;
  background:white;
  border-radius:8px;
  font-size:17px;
  font-weight:700;
}

/* 점검 현황 */
.card{
  margin-top:9px;
  background:#fff9ea;
  border:3px solid var(--line);
  border-radius:8px;
  padding:10px 15px 12px;
}

.card h2{
  margin:0 0 7px;
  text-align:center;
  font-size:24px;
}

.answer-row{
  display:grid;
  grid-template-columns:150px 1fr;
  border-top:1px solid #ddcfbc;
  padding:7px 4px;
  gap:12px;
  font-size:16px;
}

.answer-row:first-of-type{
  border-top:0;
}

.answer-label{
  font-weight:900;
}

.answer-value{
  font-weight:700;
  color:#4a433e;
}

/* 오른쪽 */
.headline{
  background:#fffaf0;
  border:3px solid var(--line);
  border-radius:8px;
  text-align:center;
  padding:13px;
  font-weight:950;
  font-size:38px;
  margin-bottom:10px;
}

.question{
  background:var(--mint);
  border:3px solid #6fb5a7;
  border-radius:8px;
  padding:15px 17px;
  margin-bottom:10px;
}

.speaker{
  display:inline-block;
  padding:7px 14px;
  border:2px solid #a58364;
  border-radius:7px;
  background:#fff;
  font-weight:900;
  margin-bottom:10px;
}

.question-text{
  font-size:29px;
  font-weight:900;
  line-height:1.45;
}

/* 선택지 */
.choices{
  display:grid;
  gap:9px;
}

.choice{
  width:100%;
  display:flex;
  gap:14px;
  align-items:center;
  text-align:left;
  background:#fff9e9;
  border:3px solid var(--line);
  border-radius:8px;
  padding:15px 16px;
  font-size:23px;
  font-weight:850;
  cursor:pointer;
}

.choice:hover{
  background:#fff1c9;
}

.choice.selected{
  outline:5px solid #8ab6d5;
  background:#eef7ff;
}

.choice .n{
  flex:0 0 42px;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#54a449;
  color:white;
  font-weight:950;
}

/* 버튼 */
.controls{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:10px;
}

.btn{
  border:3px solid var(--line);
  border-radius:8px;
  padding:11px 28px;
  font-size:21px;
  font-weight:900;
  cursor:pointer;
}

.btn.blue{
  background:var(--blue);
  color:white;
}

.btn.red{
  background:var(--red);
  color:white;
}

.btn.green{
  background:#68a871;
  color:white;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* 도움말 */
.tip{
  margin-top:10px;
  border:2px solid #d4b66a;
  border-radius:8px;
  background:#fff8da;
  padding:12px;
  font-weight:700;
  font-size:16px;
  line-height:1.6;
}

/* 결과 */
.result{
  display:none;
  background:#ffffff;
  border:3px solid var(--line);
  border-radius:10px;
  padding:25px;
}

.result h2{
  text-align:center;
  font-size:34px;
  margin-top:0;
}

.result-score{
  text-align:center;
  font-size:30px;
  font-weight:900;
  color:#29649a;
  margin:20px 0;
}

.result-message{
  background:#eef8f3;
  border:2px solid #78aa8b;
  border-radius:10px;
  padding:20px;
  font-size:21px;
  font-weight:800;
  line-height:1.7;
}

.result-list{
  margin-top:20px;
  background:#fff8e8;
  border:2px solid #c9a26c;
  border-radius:10px;
  padding:18px;
  font-size:17px;
  line-height:1.8;
}

@media(max-width:900px){
  .main{
    grid-template-columns:1fr;
  }

  .steps{
    grid-template-columns:repeat(5,1fr);
  }

  .headline{
    font-size:28px;
  }

  .question-text{
    font-size:24px;
  }

  .scene{
    min-height:350px;
  }
}
</style>
</head>

<script>

const questions = [

  {
    title:"머리는 깨끗한가요?",
    tip:"머리가 기름지거나 지저분하지 않은지 확인해 보세요.",
    caption:"면접 전 머리가 깨끗한지 확인해 봅시다."
  },

  {
    title:"머리 모양은 정돈되어 있나요?",
    tip:"머리카락이 흘러내리거나 앞머리가 눈을 가리고 있지 않은지 확인해 보세요.",
    caption:"앞머리가 눈을 가리지 않도록 단정하게 정리해 봅시다."
  },

  {
    title:"얼굴은 깨끗한가요?",
    tip:"얼굴이 깨끗한지 확인하고, 필요한 경우 면도 여부도 확인해 보세요.",
    caption:"면접 전 얼굴도 깨끗하게 정돈해 봅시다."
  },

  {
    title:"손톱은 깨끗하고 길이가 적당한가요?",
    tip:"손톱이 너무 길지 않은지, 손톱 밑이 지저분하지 않은지 확인해 보세요.",
    caption:"손과 손톱도 면접 전에 확인해야 합니다."
  },

  {
    title:"옷이 깨끗한가요?",
    tip:"옷에 얼룩이나 먼지가 묻어 있지 않은지 확인해 보세요.",
    caption:"깨끗한 옷을 입었는지 확인해 봅시다."
  },

  {
    title:"단정하게 옷을 입었나요?",
    tip:"바지나 치마가 흘러내리지 않는지, 옷이 많이 구겨지지 않았는지, 단추가 잘 여며져 있는지 확인해 보세요.",
    caption:"옷매무새와 단추, 옷의 구김을 확인해 봅시다."
  },

  {
    title:"내 몸에 맞는 크기의 옷을 입었나요?",
    tip:"옷이 너무 크거나 너무 작지는 않은지 확인해 보세요.",
    caption:"내 몸에 잘 맞는 크기의 옷인지 살펴봅시다."
  },

  {
    title:"신발은 깨끗한가요?",
    tip:"신발에 흙이나 먼지가 많이 묻어 있지 않은지 확인해 보세요.",
    caption:"면접 전 신발의 청결 상태도 확인해 봅시다."
  },

  {
    title:"신발을 바르게 신었나요?",
    tip:"신발 뒤축을 밟고 있지 않은지, 신발끈은 잘 묶여 있는지 확인해 보세요.",
    caption:"신발을 바르게 신고 있는지 확인해 봅시다."
  },

  {
    title:"오늘 나의 모습에 만족하나요?",
    tip:"거울을 보고 머리부터 신발까지 전체적인 모습을 다시 확인해 보세요.",
    caption:"마지막으로 오늘 나의 전체적인 모습을 살펴봅시다."
  }

];

let current = 0;
let answers = new Array(questions.length).fill(null);

function makeSteps(){

  const box = document.getElementById("steps");
  box.innerHTML = "";

  questions.forEach((q,i)=>{

    const div = document.createElement("div");
    div.className = "step";

    if(answers[i] !== null){
      div.classList.add("done");
    }

    if(i === current){
      div.classList.add("active");
    }

    div.innerHTML =
      '<div class="num">' +
      (i+1) +
      '</div>' +
      '점검';

    box.appendChild(div);

  });

}

function render(){

  makeSteps();

  const q = questions[current];

  document.getElementById("questionText").textContent =
    (current+1) + ". " + q.title;

  document.getElementById("tip").innerHTML =
    "💡 <b>확인 방법</b><br>" +
    q.tip;

  document.getElementById("caption").textContent =
    q.caption;

  const choices = document.getElementById("choices");

  choices.innerHTML = "";

  const data = [
    {
      value:"yes",
      text:"네, 잘 준비했습니다."
    },
    {
      value:"no",
      text:"아니요, 다시 확인하겠습니다."
    }
  ];

  data.forEach((item,index)=>{

    const button = document.createElement("button");

    button.className = "choice";

    if(answers[current] === item.value){
      button.classList.add("selected");
    }

    button.innerHTML =
      '<span class="n">' +
      (index+1) +
      '</span>' +
      item.text;

    button.onclick = ()=>{

      answers[current] = item.value;

      render();
      updateSummary();

    };

    choices.appendChild(button);

  });

  document.getElementById("prevBtn").disabled =
    current === 0;

  const next = document.getElementById("nextBtn");

  if(current === questions.length-1){
    next.textContent = "결과 보기";
  }else{
    next.textContent = "다음";
  }

  next.disabled = answers[current] === null;

}

function updateSummary(){

  const answered =
    answers.filter(v => v !== null).length;

  const yes =
    answers.filter(v => v === "yes").length;

  const no =
    answers.filter(v => v === "no").length;

  document.getElementById("answeredText").textContent =
    answered + " / " + questions.length;

  document.getElementById("yesText").textContent =
    yes + "개";

  document.getElementById("noText").textContent =
    no + "개";

}

function nextQuestion(){

  if(answers[current] === null){
    return;
  }

  if(current < questions.length - 1){

    current++;
    render();

  }else{

    showResult();

  }

}

function prevQuestion(){

  if(current > 0){

    current--;
    render();

  }

}

function showResult(){

  const yes =
    answers.filter(v => v === "yes").length;

  const no =
    answers.filter(v => v === "no").length;

  document.getElementById("quizArea").style.display = "none";
  document.getElementById("steps").style.display = "none";

  const result =
    document.getElementById("resultArea");

  result.style.display = "block";

  document.getElementById("resultScore").innerHTML =
    "잘 준비했어요 " +
    yes +
    "개 &nbsp;&nbsp; / &nbsp;&nbsp; " +
    "다시 확인해요 " +
    no +
    "개";

  let message = "";

  if(no === 0){

    message =
      "👍 면접을 위한 용모와 복장이 잘 준비되었습니다.<br>" +
      "지금처럼 단정한 모습을 유지하고 자신 있게 면접에 참여해 봅시다.";

  }else if(no <= 2){

    message =
      "🙂 거의 준비가 되었습니다.<br>" +
      "'다시 확인해요'로 선택한 부분만 한 번 더 확인해 봅시다.";

  }else{

    message =
      "🔎 조금 더 확인하면 좋겠습니다.<br>" +
      "'다시 확인해요'로 선택한 항목을 하나씩 살펴보고 면접 준비를 마무리해 봅시다.";

  }

  document.getElementById("resultMessage").innerHTML =
    message;

  const noItems = [];

  answers.forEach((answer,index)=>{

    if(answer === "no"){
      noItems.push(
        (index+1) + ". " + questions[index].title
      );
    }

  });

  const listBox =
    document.getElementById("resultList");

  if(noItems.length === 0){

    listBox.innerHTML =
      "<b>모든 항목을 잘 준비했습니다.</b>";

  }else{

    listBox.innerHTML =
      "<b>다시 확인할 항목</b><br><br>" +
      noItems.join("<br>");

  }

}

function restart(){

  current = 0;

  answers =
    new Array(questions.length).fill(null);

  document.getElementById("quizArea").style.display = "grid";
  document.getElementById("steps").style.display = "grid";
  document.getElementById("resultArea").style.display = "none";

  updateSummary();
  render();

}

updateSummary();
render();

</script>

</body>
</html>
